  <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="598" viewBox="0 0 1600 598" role="img" aria-labelledby="seekdb-runtime-modes-title seekdb-runtime-modes-desc">
   <desc>
    
    
    
    同一数据库内核，根据部署位置、连接方式和资源管理要求灵活选择
   </desc>
   <defs>
    <filter x="-6%" y="-10%" width="112%" height="125%">
     <fedropshadow dx="0" dy="3" stdDeviation="5" flood-color="#17315D" flood-opacity="0.09">
     </fedropshadow>
    </filter>
    <marker viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
     <path d="M0 0L10 5L0 10Z" fill="#7F92AE">
     </path>
    </marker>
    <marker viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
     <path d="M0 0L10 5L0 10Z" fill="#4388F4">
     </path>
    </marker>
    <linearGradient x1="0" y1="0" x2="1" y2="0">
     <stop offset="0" stop-color="#4388F4">
     </stop>
     <stop offset="1" stop-color="#8C67E8">
     </stop>
    </linearGradient>
   </defs>
   <rect x="0" y="0" width="1600" height="598" rx="24" fill="#F7F9FC" stroke="none">
   </rect>
   <circle cx="1530" cy="10" r="170" fill="#E8F2FF" opacity="0.72">
   </circle>
   <circle cx="1576" cy="18" r="92" fill="#E7F9F7" opacity="0.9">
   </circle>
   <rect x="52" y="45" width="8" height="62" rx="4" fill="url(#seekdb-runtime-modes-brand)" stroke="none">
   </rect>
   <text class="title" x="80" y="78" text-anchor="start">
    
    
    
    两种主要运行形态
   </text>
   <text class="subtitle" x="80" y="116" text-anchor="start">
    
    
    
    同一数据库内核，根据部署位置、连接方式和资源管理要求灵活选择
   </text>
   <text class="header" x="72" y="158" text-anchor="start">
    
    
    
    形态
   </text>
   <text class="header" x="312" y="158" text-anchor="start">
    
    
    
    连接方式
   </text>
   <text class="header" x="732" y="158" text-anchor="start">
    
    
    
    适合场景
   </text>
   <text class="header" x="1202" y="158" text-anchor="start">
    
    
    
    主要特点
   </text>
   <g filter="url(#seekdb-runtime-modes-shadow)">
    <rect x="48" y="182" width="1504" height="174" rx="16" fill="#FFFFFF" stroke="#4388F455" stroke-width="1.5">
    </rect>
    <rect x="48" y="182" width="240" height="174" rx="16" fill="#E8F2FF" stroke="#4388F4" stroke-width="1.5">
    </rect>
   </g>
   <line x1="304" y1="202" x2="304" y2="336" stroke="#D9E2EF" stroke-width="1.5">
   </line>
   <line x1="724" y1="202" x2="724" y2="336" stroke="#D9E2EF" stroke-width="1.5">
   </line>
   <line x1="1194" y1="202" x2="1194" y2="336" stroke="#D9E2EF" stroke-width="1.5">
   </line>
   <text class="label" x="78" y="261" text-anchor="start">
    
    
    
    嵌入式
   </text>
   <text class="label-en" x="78" y="291" fill="#1F5DB8">
    
    
    
    EMBEDDED
   </text>
   <text class="body-sm" x="332" y="262" text-anchor="start">
    <tspan x="332" dy="0">
     
     
     
     通过面向 Python、JavaScript
    </tspan>
    <tspan x="332" dy="31">
     
     
     
     等语言的 SDK 接入
    </tspan>
   </text>
   <text class="body-sm" x="752" y="262" text-anchor="start">
    <tspan x="752" dy="0">
     
     
     
     Agent、本地或桌面应用、边缘应用，
    </tspan>
    <tspan x="752" dy="31">
     
     
     
     以及需要多进程共享本地数据的场景
    </tspan>
   </text>
   <text class="body-sm" x="1222" y="262" text-anchor="start">
    <tspan x="1222" dy="0">
     
     
     
     随应用部署和交付；
    </tspan>
    <tspan x="1222" dy="31">
     
     
     
     支持多个应用进程共享数据
    </tspan>
   </text>
   <g filter="url(#seekdb-runtime-modes-shadow)">
    <rect x="48" y="372" width="1504" height="174" rx="16" fill="#FFFFFF" stroke="#8C67E855" stroke-width="1.5">
    </rect>
    <rect x="48" y="372" width="240" height="174" rx="16" fill="#F1EBFF" stroke="#8C67E8" stroke-width="1.5">
    </rect>
   </g>
   <line x1="304" y1="392" x2="304" y2="526" stroke="#D9E2EF" stroke-width="1.5">
   </line>
   <line x1="724" y1="392" x2="724" y2="526" stroke="#D9E2EF" stroke-width="1.5">
   </line>
   <line x1="1194" y1="392" x2="1194" y2="526" stroke="#D9E2EF" stroke-width="1.5">
   </line>
   <text class="label" x="78" y="451" text-anchor="start">
    
    
    
    服务器模式
   </text>
   <text class="label-en" x="78" y="481" fill="#54379C">
    
    
    
    SERVER
   </text>
   <text class="body-sm" x="332" y="452" text-anchor="start">
    <tspan x="332" dy="0">
     
     
     
     通过 MySQL 协议和 SQL，
    </tspan>
    <tspan x="332" dy="31">
     
     
     
     使用标准驱动或客户端连接
    </tspan>
   </text>
   <text class="body-sm" x="752" y="452" text-anchor="start">
    <tspan x="752" dy="0">
     
     
     
     独立数据服务、跨主机访问、
    </tspan>
    <tspan x="752" dy="31">
     
     
     
     既有 MySQL 应用和集中化生产部署
    </tspan>
   </text>
   <text class="body-sm" x="1222" y="452" text-anchor="start">
    <tspan x="1222" dy="0">
     
     
     
     服务独立运行；便于统一资源管理、
    </tspan>
    <tspan x="1222" dy="31">
     
     
     
     远程访问与运维
    </tspan>
   </text>
  </svg>
